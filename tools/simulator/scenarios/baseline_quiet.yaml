name: baseline_quiet
description: >
  A calm market: honest reporters only, normal day-to-day volatility, no events. Measures false
  alarms and how closely the band tracks the true price.
days: 45
seed: 7
area: demo-central
products: [onion, rice, eggs]
true_price: { onion: 80, rice: 60, eggs: 150 }
daily_volatility: { onion: 0.02, rice: 0.005, eggs: 0.01 }
shop_premium: { shop-a: 0.00, shop-b: -0.03, shop-c: 0.02, shop-d: 0.00, shop-e: 0.04 }
reporters:
  honest: { count: 40, noise_sigma: 0.02, reports_per_day: 0.6 }
location: { gps_rate: 0.8, accuracy_m: [10, 80] }
targets:
  max_false_outliers_per_product_per_30d: 1
  band_mape_max: 0.05
  band_warmup_days: 3
